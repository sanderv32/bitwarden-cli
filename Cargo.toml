[package]
name = "bw"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
expect_used = "warn"
mem_forget = "deny"
panic = "deny"
unwrap_used = "deny"

[lib]
name = "lib"
path = "src/lib.rs"

[dependencies]
bitwarden-api-api = "3"
bitwarden-crypto = "3"
# bitwarden-crypto 3.0.0 declares ml-dsa = "^0.1.0-rc.8" but breaks against
# ml-dsa 0.1.1 (KeyGen/from_seed API changes). Pin to the version bitwarden
# themselves lock to. Remove once bitwarden-crypto publishes a fix.
ml-dsa = "=0.1.0-rc.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
tokio = { version = "1.53", features = ["full"] }
uuid = "1.26"
rpassword = "7.5.4"
tracing =  "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
base64 = "0.23"
thiserror = "2"
anyhow = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = "0.10"

